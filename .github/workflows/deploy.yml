name: Deploy backend

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Laravel/Vite assets
        run: npm run build

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=storage/logs/* \
            -czf /tmp/ecom-backend.tar.gz .

      - name: Upload release
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" /tmp/ecom-backend.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ecom-backend.tar.gz"

      - name: Activate release
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -e
          cd "${{ secrets.DEPLOY_PATH }}"
          tar -xzf /tmp/ecom-backend.tar.gz
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          rm -f /tmp/ecom-backend.tar.gz
          EOF
